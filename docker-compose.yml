# Shared settings of all Airflow services. This is for LOCAL use only: the passwords and the
# JWT secret below are demo values, change them before exposing Airflow to a network.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: ecom-pipeline-airflow:local
  profiles: ["airflow"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor  # no Celery or Redis needed on one machine
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-demo-jwt-secret-change-me}
    # Settings of the pipeline itself (its tasks inherit these variables). The warehouse is
    # the `db` service of this file.
    POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db # inside the compose network the database is reachable as "db"
      POSTGRES_PORT: "5432"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    profiles: ["tools"] # not started by `docker compose up`; use `docker compose run --rm pipeline <command>`

  # --- Airflow (optional): start it with `docker compose --profile airflow up -d --build` ---

  # Airflow keeps its own bookkeeping (runs, task states) in a separate database, so the
  # warehouse above stays free of it. It is only reachable inside the Docker network.
  airflow-db:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once: creates the Airflow tables and the login user, then exits.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    restart: "no"

  airflow-apiserver:  # the web UI and the API
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:  # starts the tasks when they are due (LocalExecutor: it runs them itself)
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:  # reads the DAG files in airflow/dags
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-db-data:
  airflow-logs:
